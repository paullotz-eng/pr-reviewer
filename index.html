<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PR Reviewer</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --muted:#8b949e; --accent:#2f81f7; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); display:grid; grid-template-columns:380px 1fr; height:100vh; }
  aside { border-right:1px solid var(--border); overflow-y:auto; }
  main { overflow-y:auto; padding:20px 28px; }
  header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--bg); }
  h1 { font-size:15px; margin:0; display:flex; align-items:center; gap:8px; }
  h1 img { width:32px; height:32px; image-rendering:pixelated; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--muted); }
  .pr { padding:10px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
  .pr:hover { background:var(--panel); }
  .pr.active { background:var(--panel); box-shadow:inset 3px 0 var(--accent); }
  .pr .title { font-weight:600; }
  .meta { color:var(--muted); font-size:12px; }
  .draft { color:var(--muted); border:1px solid var(--border); border-radius:10px; padding:0 6px; font-size:11px; margin-left:4px; }
  .tag { border-radius:10px; padding:0 6px; font-size:11px; margin-left:4px; font-weight:600; }
  .tag.team { background:#1f6feb33; color:#58a6ff; border:1px solid #1f6feb; }
  .tag.you { background:#23863633; color:#3fb950; border:1px solid #238636; }
  .tag.conv { background:#8957e533; color:#bc8cff; border:1px solid #8957e5; }
  .tag.chal { background:#d2992233; color:#e3b341; border:1px solid #9e6a03; }
  .challenge { color:var(--muted); font-size:12px; margin-top:6px; }
  .challenge.confirmed::before { content:'✓ '; color:#3fb950; }
  .challenge.unresolved::before { content:'? '; color:#d29922; }
  .challenge.refuted::before { content:'✗ '; color:#f85149; }
  details.rejected { margin-top:20px; color:var(--muted); }
  details.rejected summary { cursor:pointer; margin-bottom:8px; }
  details.rejected .comment { opacity:.6; }
  .pr .meta { display:flex; gap:8px; align-items:center; }
  .status-tag { margin-left:auto; white-space:nowrap; font-size:11px; border-radius:10px; padding:0 6px; border:1px solid var(--border); color:var(--muted); }
  .status-tag.blocking { color:#f85149; border-color:#f85149; }
  .status-tag.comments { color:#d29922; border-color:#9e6a03; }
  .status-tag.clean, .status-tag.posted { color:#3fb950; border-color:#238636; }
  .search { padding:10px 16px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:6px; }
  .search input[type=search] { width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font:inherit; }
  .search input[type=search]:focus { outline:none; border-color:var(--accent); }
  .search label { color:var(--muted); font-size:12px; cursor:pointer; }
  .empty { color:var(--muted); padding:40px 0; }
  .summary { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin:12px 0 20px; white-space:pre-wrap; }
  .verdict { font-weight:600; text-transform:uppercase; font-size:12px; }
  .verdict.approve { color:#3fb950; } .verdict.request_changes { color:#f85149; } .verdict.comment { color:#d29922; }
  .comment { border:1px solid var(--border); border-left-width:4px; border-radius:8px; padding:10px 14px; margin-bottom:10px; background:var(--panel); }
  .comment.posting { opacity:.6; cursor:progress; }
  .comment.posted { opacity:.55; }
  .actions { display:flex; gap:6px; margin-top:8px; }
  .actions button { font-size:12px; padding:2px 8px; }
  textarea.edit { width:100%; min-height:120px; margin-top:6px; background:var(--bg); color:var(--fg); border:1px solid var(--accent); border-radius:6px; padding:8px; font:13px/1.45 ui-monospace, monospace; resize:vertical; }
  .edited { color:var(--accent); font-size:11px; }
  .submit { position:sticky; bottom:0; background:var(--bg); border-top:1px solid var(--border); padding:12px 0; margin-top:16px; display:grid; gap:8px; }
  .submit textarea { width:100%; min-height:56px; background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:8px; font:inherit; resize:vertical; }
  .submit .row { display:flex; gap:8px; align-items:center; }
  .submit select { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font:inherit; }
  .submit button.primary { background:#238636; border-color:#2ea043; color:#fff; }
  .warn { color:#d29922; font-size:12px; margin-top:6px; }
  .comment.failed { border-color:#f85149; }
  .comment .top { display:flex; gap:8px; align-items:center; font-size:12px; margin-bottom:6px; }
  .sev { font-weight:700; text-transform:uppercase; }
  .critical { border-left-color:#f85149; } .critical .sev { color:#f85149; }
  .high { border-left-color:#db6d28; } .high .sev { color:#db6d28; }
  .medium { border-left-color:#d29922; } .medium .sev { color:#d29922; }
  .low { border-left-color:#2f81f7; } .low .sev { color:#2f81f7; }
  .info { border-left-color:#8b949e; } .info .sev { color:#8b949e; }
  .loc { font-family:ui-monospace, monospace; color:var(--muted); }
  .status { margin-left:auto; color:var(--muted); }
  .status a { color:#3fb950; }
  .cc { display:inline-block; border-radius:4px; padding:0 6px; font-size:12px; font-weight:600; color:#fff; margin-right:6px; }
  .cc .dec { opacity:.85; font-weight:400; }
  .topic { color:var(--muted); font-size:11px; border:1px solid var(--border); border-radius:10px; padding:0 6px; margin-right:4px; }
  .subject { font-weight:600; }
  .body { white-space:pre-wrap; font-family:ui-monospace, monospace; font-size:13px; }
  .hint { color:var(--muted); font-size:12px; margin-bottom:8px; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .error { color:#f85149; white-space:pre-wrap; }
  a { color:var(--accent); }
</style>
</head>
<body>
<aside>
  <header><h1><img src="/favicon.svg" alt="">Open pull requests</h1><button id="refresh">Refresh</button></header>
  <div class="search">
    <input type="search" id="q" placeholder="Filter… (Enter to search GitHub)" autocomplete="off">
    <label><input type="checkbox" id="teamOnly"> Only my team</label>
  </div>
  <div id="prs"><p class="empty" style="padding:16px">Loading…</p></div>
</aside>
<main id="main"><p class="empty">Pick a pull request to review it.</p></main>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let current = null;

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  for (const [n, u] of [[86400, 'd'], [3600, 'h'], [60, 'm']]) if (s >= n) return Math.floor(s / n) + u + ' ago';
  return 'just now';
}

let allPRs = [], searched = '';

async function loadPRs(query = '', quiet = false) {
  const list = $('#prs');
  if (!quiet) list.replaceChildren(h('p', 'empty', query ? `Searching GitHub for "${query}"…` : 'Loading…'));
  try {
    allPRs = await api('/api/prs?q=' + encodeURIComponent(query)) ?? [];
    searched = query;
    renderPRs();
  } catch (e) { if (!quiet) list.replaceChildren(h('p', 'error', e.message)); }
}

function renderPRs() {
  const list = $('#prs');
  const q = $('#q').value.trim();
  const terms = q === searched ? [] : q.toLowerCase().split(/\s+/).filter(Boolean); // server already matched it
  const teamOnly = $('#teamOnly').checked;
  const prs = allPRs.filter(pr => {
    if (teamOnly && !pr.team && !pr.mine) return false;
    const hay = `${pr.title} ${pr.author} ${pr.repo} #${pr.number}`.toLowerCase();
    return terms.every(t => hay.includes(t));
  });
  list.replaceChildren();
  if (!prs.length) list.append(h('p', 'empty', 'No matching pull requests. Press Enter to search GitHub.'));
  for (const pr of prs) {
    const el = h('div', 'pr' + (current && current.url === pr.url ? ' active' : ''));
    const title = h('div', 'title', pr.title);
    if (pr.mine) title.append(h('span', 'tag you', 'you'));
    else if (pr.team) title.append(h('span', 'tag team', 'team'));
    if (pr.isDraft) title.append(h('span', 'draft', 'draft'));
    const meta = h('div', 'meta');
    meta.append(h('span', null, `${pr.repo}#${pr.number} · @${pr.author} · ${ago(pr.createdAt)}`));
    if (pr.status) {
      const tag = h('span', 'status-tag ' + pr.statusKind, pr.status);
      tag.title = pr.statusKind === 'running' ? 'Claude is reviewing this PR' : 'Stored review: click the PR to open it';
      meta.append(tag);
    }
    el.append(title, meta);
    el.onclick = () => { document.querySelectorAll('.pr.active').forEach(e => e.classList.remove('active')); el.classList.add('active'); review(pr); };
    list.append(el);
  }
}

async function review(pr, force = false) {
  current = pr;
  const main = $('#main');
  const head = h('div');
  const a = h('a', null, `${pr.repo}#${pr.number}`); a.href = pr.url; a.target = '_blank';
  head.append(h('h2', null, pr.title), a, document.createTextNode(` · @${pr.author} · ${ago(pr.createdAt)}`));
  const loading = h('p', 'empty'); loading.append(h('span', 'spinner'), 'Claude is reviewing this PR… (this can take a minute or two)');
  main.replaceChildren(head, loading);

  let rev;
  try { rev = await api('/api/review', { repo: pr.repo, number: pr.number, force }); }
  catch (e) { if (current === pr) main.replaceChildren(head, h('p', 'error', e.message)); return; }
  if (current !== pr) return;

  const rerun = h('button', null, 'Re-run review'); rerun.style.marginLeft = '12px';
  rerun.onclick = () => review(pr, true);
  const summary = h('div', 'summary');
  const verdict = h('div', 'verdict ' + rev.verdict, rev.verdict.replace('_', ' '));
  if (rev.conventions) verdict.append(h('span', 'tag conv', rev.conventions));
  if (rev.challenge) verdict.append(h('span', 'tag chal', rev.challenge));
  verdict.append(rerun);
  summary.append(verdict, document.createTextNode(rev.summary));
  if (rev.outdated) summary.append(h('div', 'warn', 'New commits were pushed after this review. Line numbers may be off: re-run it before posting.'));

  const selected = new Set(rev.comments.flatMap((c, i) => c.postedUrl ? [] : [i]));
  const comments = h('div');
  comments.append(h('div', 'hint', `${rev.comments.length} suggested comments, sorted by severity and importance. Edit them, post one now, or tick them and submit them together as one review.`));
  const panel = submitPanel(pr, rev, selected);
  rev.comments.forEach((c, i) => comments.append(commentCard(pr, rev, c, i, selected, panel.update)));
  if (rev.rejected?.length) {
    const rejected = h('details', 'rejected');
    rejected.append(h('summary', null, `${rev.rejected.length} finding(s) refuted by the challenger, not shown above`));
    for (const c of rev.rejected) {
      const el = h('div', 'comment ' + c.severity);
      el.style.cursor = 'default';
      el.append(h('div', 'loc', c.file ? `${c.file}:${c.line}` : 'general'), preview(c), h('div', 'challenge refuted', c.challenge.replace(/^refuted: /, '')));
      rejected.append(el);
    }
    comments.append(rejected);
  }
  main.replaceChildren(head, summary, comments, panel.el);
}

// Readable preview of a comment; the posted body carries the extension's badge markdown.
const LABEL_COLORS = { praise: '28A745', nitpick: 'F59E0B', suggestion: '3B82F6', todo: 'E879F9', issue: 'EF4444', question: '8B5CF6', thought: '6B7280', chore: 'F97316' };
function preview(c) {
  if (!c.decoration) return h('div', 'body', c.body); // reviews stored before the Pullpo format
  const el = h('div');
  const cc = h('span', 'cc', c.label + ' ');
  cc.style.background = '#' + (LABEL_COLORS[c.label] || '6B7280');
  cc.append(h('span', 'dec', c.decoration));
  el.append(cc, h('span', 'subject', c.subject));
  for (const t of c.topics || []) el.append(h('span', 'topic', t));
  if (c.discussion) el.append(h('div', 'body', c.discussion));
  return el;
}

function commentCard(pr, rev, c, index, selected, onSelect) {
  const el = h('div', 'comment ' + c.severity);
  const top = h('div', 'top');
  const pick = h('input'); pick.type = 'checkbox'; pick.title = 'Include in the review';
  pick.checked = selected.has(index); pick.disabled = !!c.postedUrl;
  pick.onchange = () => { pick.checked ? selected.add(index) : selected.delete(index); onSelect(); };
  const status = h('span', 'status');
  top.append(pick, h('span', 'sev', c.severity), h('span', null, `importance ${c.importance}/10`), h('span', 'loc', c.file ? `${c.file}:${c.line}` : 'general'), status);

  // After an edit, show the exact text that will be posted.
  const view = h('div');
  const showView = () => view.replaceChildren(c.edited ? h('div', 'body', c.body) : preview(c));
  showView();
  el.append(top, view);
  if (c.challenge) {
    const [outcome, ...why] = c.challenge.split(': ');
    el.append(h('div', 'challenge ' + outcome, `challenger ${outcome}: ${why.join(': ')}`));
  }

  const actions = h('div', 'actions');
  const editBtn = h('button', null, 'Edit');
  const postBtn = h('button', null, 'Post now');
  actions.append(editBtn, postBtn);
  el.append(actions);

  editBtn.onclick = () => {
    if (editBtn.textContent === 'Done') { showView(); editBtn.textContent = 'Edit'; return; }
    const ta = h('textarea', 'edit'); ta.value = c.body;
    ta.oninput = () => { c.body = ta.value; c.edited = true; if (!status.textContent) status.append(h('span', 'edited', 'edited')); };
    view.replaceChildren(ta); ta.focus();
    editBtn.textContent = 'Done';
  };

  const markPosted = () => {
    el.classList.add('posted'); actions.remove();
    pick.checked = false; pick.disabled = true; selected.delete(index); onSelect();
    const link = h('a', null, '✓ posted'); link.href = c.postedUrl; link.target = '_blank';
    status.replaceChildren(link);
  };
  if (c.postedUrl) markPosted();

  postBtn.onclick = async () => {
    el.classList.add('posting'); el.classList.remove('failed'); status.textContent = 'posting…';
    try {
      const res = await api('/api/comment', { repo: pr.repo, number: pr.number, body: c.body, index });
      c.postedUrl = res.url || pr.url;
      markPosted();
    } catch (err) {
      el.classList.add('failed'); status.textContent = 'failed: ' + err.message;
    } finally { el.classList.remove('posting'); }
  };
  return el;
}

// The panel that submits the ticked comments as one GitHub review with a verdict.
function submitPanel(pr, rev, selected) {
  const el = h('div', 'submit');
  const body = h('textarea'); body.placeholder = 'Review summary (optional, posted as the review body)';
  const event = h('select');
  for (const [v, label] of [['COMMENT', 'Comment'], ['APPROVE', 'Approve'], ['REQUEST_CHANGES', 'Request changes']]) {
    const o = h('option', null, label); o.value = v; event.append(o);
  }
  event.value = rev.verdict.toUpperCase();
  const btn = h('button', 'primary');
  const status = h('span', 'status');
  const row = h('div', 'row'); row.append(event, btn, status);
  el.append(body, row);

  const update = () => { btn.textContent = `Submit review with ${selected.size} comment${selected.size === 1 ? '' : 's'}`; };
  update();

  btn.onclick = async () => {
    if (event.value === 'REQUEST_CHANGES' && !body.value.trim() && !selected.size) {
      status.textContent = 'Requesting changes needs a summary or at least one comment.'; return;
    }
    btn.disabled = true; status.textContent = 'submitting…';
    try {
      await api('/api/submit', { repo: pr.repo, number: pr.number, event: event.value, body: body.value,
        comments: [...selected].map(i => ({ index: i, body: rev.comments[i].body })) });
      review(pr); // reload from the store, which now marks them posted
    } catch (err) {
      status.textContent = 'failed: ' + err.message; btn.disabled = false;
    }
  };
  return { el, update };
}

$('#refresh').onclick = () => { $('#q').value = ''; loadPRs(); };
$('#q').oninput = renderPRs;
$('#q').onkeydown = (e) => { if (e.key === 'Enter') loadPRs($('#q').value.trim()); };
$('#teamOnly').onchange = renderPRs;
loadPRs();
// Pick up new PRs and background reviews, unless a GitHub search is shown.
setInterval(() => { if (!searched && document.visibilityState === 'visible') loadPRs('', true); }, 60_000);
</script>
</body>
</html>
